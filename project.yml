name: RemoteDeck
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "15.0"

packages:
  RFBKit:
    path: Packages/RFBKit
  RemoteDeckCore:
    path: Packages/RemoteDeckCore
  ClaudeKit:
    path: Packages/ClaudeKit

# Explicit scheme (otherwise xcodegen generates none → scheme lost on every regeneration).
schemes:
  RemoteDeck:
    build:
      targets:
        RemoteDeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemoteDeckTests
        - package: RFBKit/RFBKitTests
        - package: RemoteDeckCore/RemoteDeckCoreTests
        - package: ClaudeKit/ClaudeKitTests

targets:
  RemoteDeck:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteDeck
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    dependencies:
      - package: RFBKit
      - package: RemoteDeckCore
      - package: ClaudeKit
    settings:
      base:
        PRODUCT_NAME: RemoteDeck
        # Same module name in every config (Debug's product is "RemoteDeck Dev"),
        # so tests can `@testable import RemoteDeck`.
        PRODUCT_MODULE_NAME: RemoteDeck
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.remotedeck
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: RemoteDeck/RemoteDeck.entitlements
        # Ad-hoc signing so sandbox entitlements apply in local builds.
        # Release DMGs are signed with Developer ID by Scripts/release.sh.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.remotedeck.dev
          PRODUCT_NAME: RemoteDeck Dev
    info:
      path: RemoteDeck/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        # Bonjour Discovery (T3.6): the types the Discovery Panel browses, and the Local Network
        # prompt text (TN3179). Browsing needs no extra sandbox entitlement: network.client
        # already lets the app reach mDNSResponder.
        NSBonjourServices:
          - _rfb._tcp
          - _net-assistant._udp
        NSLocalNetworkUsageDescription: "RemoteDeck looks for Macs with Screen Sharing or Remote Management on your local network, and connects to the machines you add."

  RemoteDeckTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteDeckTests
    dependencies:
      - target: RemoteDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.remotedeck.tests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RemoteDeck.app/Contents/MacOS/RemoteDeck
      configs:
        # XcodeGen infers the host from the target name; Debug's product is "RemoteDeck Dev".
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/RemoteDeck Dev.app/Contents/MacOS/RemoteDeck Dev
