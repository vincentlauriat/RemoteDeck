name: RemoteDeck
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "15.0"

packages:
  RFBKit:
    path: Packages/RFBKit
  RemoteDeckCore:
    path: Packages/RemoteDeckCore
  ClaudeKit:
    path: Packages/ClaudeKit
  # Auto-update (T6.3). Pinned to one release: Scripts/release.sh fetches the same version's
  # sign_update (SPARKLE_VERSION there), checked against the tarball's SHA-256.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"

# Explicit scheme (otherwise xcodegen generates none → scheme lost on every regeneration).
schemes:
  RemoteDeck:
    build:
      targets:
        RemoteDeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemoteDeckTests
        - package: RFBKit/RFBKitTests
        - package: RemoteDeckCore/RemoteDeckCoreTests
        - package: ClaudeKit/ClaudeKitTests

targets:
  RemoteDeck:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteDeck
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    dependencies:
      - package: RFBKit
      - package: RemoteDeckCore
      - package: ClaudeKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: RemoteDeck
        # Same module name in every config (Debug's product is "RemoteDeck Dev"),
        # so tests can `@testable import RemoteDeck`.
        PRODUCT_MODULE_NAME: RemoteDeck
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.remotedeck
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # One file for both configurations: `aps-environment` development, as the Development profile
        # that signs Debug builds and Release archives grants; `-exportArchive` (developer-id) rewrites
        # it and the iCloud environment to production (Scripts/release.sh checks both).
        CODE_SIGN_ENTITLEMENTS: RemoteDeck/RemoteDeck.entitlements
        # iCloud Sync (T4.3): automatic signing on Vincent's team, so Xcode provisions the App IDs
        # (iCloud/CloudKit, push, keychain sharing) and the container iCloud.fr.vincentlauriat.remotedeck
        # (one for both apps; Debug uses CloudKit's Development environment, Release Production).
        # Local builds need `-allowProvisioningUpdates` once per new profile. Release DMGs are archived
        # and exported with Developer ID by Scripts/release.sh.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: KFLACS69T9
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.remotedeck.dev
          PRODUCT_NAME: RemoteDeck Dev
    info:
      path: RemoteDeck/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        # Bonjour Discovery (T3.6): the types the Discovery Panel browses, and the Local Network
        # prompt text (TN3179). Browsing needs no extra sandbox entitlement: network.client
        # already lets the app reach mDNSResponder.
        NSBonjourServices:
          - _rfb._tcp
          - _net-assistant._udp
        NSLocalNetworkUsageDescription: "RemoteDeck looks for Macs with Screen Sharing or Remote Management on your local network, and connects to the machines you add."
        # Sparkle auto-update (T6.3). Public half of the EdDSA key in the login keychain under the
        # account "RemoteDeck" (sign_update --account RemoteDeck): NEVER regenerate it nor change this
        # value, or every installed copy rejects all later updates (see Scripts/release.sh header).
        # The updater only starts in a Release build, never under XCTest, -LibraryDemo or -FramebufferDebug
        # (AppUpdater); Debug builds never start it.
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/RemoteDeck/main/appcast.xml"
        SUPublicEDKey: "zMdb1qKvrTXX6nYkToyWzl8IGNYyXUMBEH5xKMtL2nw=" # gitleaks:allow (Sparkle public key)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        # Sandboxed app (Sparkle › Sandboxing): the Installer XPC service installs outside the
        # sandbox; it needs the -spks / -spki mach-lookup exceptions in RemoteDeck.entitlements. No
        # Downloader service: network.client is already granted.
        SUEnableInstallerLauncherService: true

  RemoteDeckTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteDeckTests
    dependencies:
      - target: RemoteDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.remotedeck.tests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        # Manual, no profile: a test bundle needs none, and automatic signing could register a
        # `.tests` App ID. Same team as the host app, whose hardened runtime refuses to load a bundle
        # signed by another team (or ad hoc).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: KFLACS69T9
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RemoteDeck.app/Contents/MacOS/RemoteDeck
      configs:
        # XcodeGen infers the host from the target name; Debug's product is "RemoteDeck Dev".
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/RemoteDeck Dev.app/Contents/MacOS/RemoteDeck Dev
