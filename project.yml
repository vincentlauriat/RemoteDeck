name: RemoteDeck
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "15.0"

packages:
  RFBKit:
    path: Packages/RFBKit

# Explicit scheme (otherwise xcodegen generates none → scheme lost on every regeneration).
schemes:
  RemoteDeck:
    build:
      targets:
        RemoteDeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RFBKit/RFBKitTests

targets:
  RemoteDeck:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteDeck
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    dependencies:
      - package: RFBKit
    settings:
      base:
        PRODUCT_NAME: RemoteDeck
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.remotedeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: RemoteDeck/RemoteDeck.entitlements
        # Signing, sandbox and CloudKit are configured in T1.2.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: RemoteDeck/Info.plist
      properties:
        CFBundleName: RemoteDeck
        CFBundleDisplayName: RemoteDeck
        CFBundleIdentifier: fr.vincentlauriat.remotedeck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
