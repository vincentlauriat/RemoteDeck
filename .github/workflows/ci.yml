name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege (T5.3 L5): the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: RFBKit tests
        working-directory: Packages/RFBKit
        run: swift test

      # Also run by the app scheme below; kept as a fast, focused failure signal.
      - name: RemoteDeckCore tests
        working-directory: Packages/RemoteDeckCore
        run: swift test

      - name: ClaudeKit tests
        working-directory: Packages/ClaudeKit
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test app scheme
        run: |
          xcodebuild -project RemoteDeck.xcodeproj -scheme RemoteDeck \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO test
